name: Restore maintained source

on:
  push:
    paths:
      - .github/workflows/restore-maintained-source.yml

permissions:
  contents: write

concurrency:
  group: restore-maintained-source
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore, verify, and commit maintained source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_URL: https://sb-62h6noavcold.vercel.run/nyc-recs-source-2026-11-12.tar.gz
          SOURCE_SHA256: cebb68d2d053f925bf515d99b837e713685b758fa3c3080322b9696aff5f2652
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/repository"
          source_dir="$RUNNER_TEMP/nyc-source"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          mkdir -p "$source_dir"
          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_URL" -o "$RUNNER_TEMP/nyc-source.tar.gz"
          printf '%s  %s\n' "$SOURCE_SHA256" "$RUNNER_TEMP/nyc-source.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nyc-source.tar.gz" -C "$source_dir"
          rsync -a --delete --exclude='.git/' "$source_dir/" "$work/"
          rm -f "$work/public/og-image.png"
          cd "$work"
          npm ci
          npm run verify
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: restore and harden NYC recs app"
          git push origin HEAD:main
