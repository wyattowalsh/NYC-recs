name: Publish audit refinement

on:
  push:
    branches: [audit-refinement-2026-11-13]
    paths:
      - .github/workflows/publish-audit-refinement.yml

permissions:
  contents: write

concurrency:
  group: publish-audit-refinement
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Replace branch with verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_URL: https://sb-62h6noavcold.vercel.run/nyc-recs-audit-refinement.tar.gz
          SOURCE_SHA256: d8da2607aa013abe846eb1923604c113dcd38054c69475136a1632757d72e133
          EXPECTED_BASE: 293b73ce7c3470ffb84cd13eb5206a7821521200
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/repository"
          archive="$RUNNER_TEMP/candidate.tar.gz"
          extracted="$RUNNER_TEMP/extracted"

          git clone --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          cd "$work"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD

          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_URL" -o "$archive"
          printf '%s  %s\n' "$SOURCE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$extracted"
          tar -xzf "$archive" -C "$extracted"
          test -f "$extracted/source/package.json"
          test -f "$extracted/source/package-lock.json"

          rsync -a --delete --exclude='.git/' "$extracted/source/" "$work/"

          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh"
          nvm install 24
          nvm use 24

          npm ci
          npm install-scripts ls
          npm run verify
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: simplify and harden NYC recs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
