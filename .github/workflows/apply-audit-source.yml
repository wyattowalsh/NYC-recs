name: Apply audited source

on:
  push:
    branches:
      - audit-refine-2026-11-13
    paths:
      - .github/workflows/apply-audit-source.yml

permissions:
  contents: write

concurrency:
  group: apply-audited-source
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore, verify, and publish audited source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_URL: https://sb-62h6noavcold.vercel.run/nyc-recs-audit-source.tar.gz
          SOURCE_SHA256: 80e90e3149b052ca37fa6b13b5b2a24bf31ab9160b42342c400725fd683be48b
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/repository"
          source_dir="$RUNNER_TEMP/audited-source"
          archive="$RUNNER_TEMP/audited-source.tar.gz"

          git clone --branch "$GITHUB_REF_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          mkdir -p "$source_dir"
          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_URL" -o "$archive"
          printf '%s  %s\n' "$SOURCE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$source_dir"
          rsync -a --delete --exclude='.git/' "$source_dir/" "$work/"

          cd "$work"
          npm ci
          npm run verify
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm install-scripts ls

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Audited source produced no changes.' >&2; exit 1; }
          git commit -m "refactor: simplify and harden NYC recs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
